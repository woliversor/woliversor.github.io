<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>William Oliveira</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      text-align: center;
    }

    .card {
      background: #020617;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(56,189,248,0.15);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56,189,248,0.6);
      margin-bottom: 15px;
      transition: 0.3s;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    h1 {
      margin: 10px 0 5px;
      color: #38bdf8;
    }

    p {
      margin: 0 0 20px;
      font-size: 14px;
    }

    .link {
      display: block;
      background: #0f172a;
      margin: 10px 0;
      padding: 15px;
      border-radius: 10px;
      text-decoration: none;
      color: #e2e8f0;
      font-weight: bold;
      transition: 0.3s;
      border: 1px solid #1e293b;
    }

    .link:hover {
      background: #38bdf8;
      color: #020617;
      transform: scale(1.03);
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <!-- LOGO -->
    <img src="logo.png" class="avatar" alt="Logo William Oliveira">

    <h1>William Oliveira</h1>
    <p>Cybersecurity Engineer | Infrastructure Architect | Cloud Specialist</p>

    <a class="link" href="https://www.linkedin.com/in/woliversor/" target="_blank">
      🔗 LinkedIn
    </a>

    <a class="link" href="https://github.com/woliversor" target="_blank">
      💻 GitHub
    </a>

    <a class="link" href="curriculo.pdf" target="_blank">
      📄 Currículo (PDF)
    </a>

    <a class="link" href="mailto:woliversor@hotmail.com">
      📧 Email
    </a>

    <footer>
      © 2026 William Oliveira
    </footer>

  </div>
</div>

</body>
</html>
